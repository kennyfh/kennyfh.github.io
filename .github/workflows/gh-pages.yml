# https://blowfish.page/docs/hosting-deployment/#github-pages

name: GitHub Pages

on:
  push:
    branches:
      - main
  # En las PR solo se compila, para detectar errores antes de fusionar
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          # Sin enableGitInfo no hace falta el historial: clon superficial (también del tema)
          fetch-depth: 1

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          # Imágenes ya procesadas: evita redimensionarlas en cada despliegue
          path: resources/_gen
          key: hugo-resources-${{ hashFiles('assets/**', 'content/**/*.png', 'content/**/*.jpg', 'content/**/*.jpeg', 'content/**/*.webp', 'config/**', '.gitmodules') }}
          restore-keys: hugo-resources-

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Última versión soportada por Blowfish (themes/blowfish/release-versions/hugo-latest.txt)
          hugo-version: '0.160.1'
          extended: true

      - name: Build
        run: hugo --minify --gc

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          cname: kennyfh.eu
          # gh-pages solo guarda el último despliegue, no una copia por cada push
          force_orphan: true
