# Configuración del sitio. Hugo no hereda estos valores del tema, así que se
# declaran aquí aunque coincidan con los de Blowfish.
# https://blowfish.page/docs/configuration/

theme = "blowfish"
baseURL = "https://kennyfh.eu/"
defaultContentLanguage = "en"

enableRobotsTXT = true
enableEmoji = true
summaryLength = 0

[pagination]
  pagerSize = 100

[imaging]
  anchor = "Center"

# Solo tags: el tema también define categories, series y authors, y el campo
# `authors` de las publicaciones generaría una página por cada coautor.
[taxonomies]
  tag = "tags"

[sitemap]
  changefreq = "daily"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"] # JSON = índice del buscador
