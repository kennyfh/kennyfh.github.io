# Opciones de Blowfish. Solo figura lo que cambia respecto a los valores por
# defecto del tema (themes/blowfish/config/_default/params.toml).
# https://blowfish.page/docs/configuration/#theme-parameters

defaultAppearance = "dark"
highlightCurrentMenuArea = true
smartTOC = true
smartTOCHideUnfocusedChildren = false

[header]
  layout = "fixed"

[homepage]
  layout = "background"
  homepageImage = "background.webp"

[article]
  showTableOfContents = true

[list]
  showHero = true
  heroStyle = "background"
  showBreadcrumbs = true
  showTableOfContents = true
  groupByYear = false
